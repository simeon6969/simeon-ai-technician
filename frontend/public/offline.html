<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f766e"><title>Simeon — Offline</title>
<style>body{margin:0;background:#f8faf9;color:#0f172a;font:18px system-ui;display:grid;place-items:center;min-height:100vh}main{max-width:440px;padding:32px}h1{color:#0f766e}p{line-height:1.6}button{background:#0f766e;color:white;border:0;border-radius:12px;padding:14px 24px;font:inherit;cursor:pointer}</style></head>
<body><main><h1>Simeon</h1><h2 id="title">You’re offline</h2><p id="message">Connect to the internet to use Simeon, save records and browse current listings.</p><button id="retry">Try again</button></main>
<script>
const copy={en:['You’re offline','Connect to the internet to use Simeon, save records and browse current listings.','Try again'],rw:['Nta interineti ihari','Huza na interineti kugira ngo ukoreshe Simeon, ubike amakuru kandi urebe ibyatangajwe.','Ongera ugerageze'],fr:['Vous êtes hors ligne','Connectez-vous à Internet pour utiliser Simeon, enregistrer vos données et consulter les annonces.','Réessayer'],sw:['Huna mtandao','Unganisha intaneti ili kutumia Simeon, kuhifadhi rekodi na kuona matangazo.','Jaribu tena']};let language='en';try{language=localStorage.getItem('simeon_language')||'en'}catch{}const text=copy[language]||copy.en;document.documentElement.lang=copy[language]?language:'en';['title','message','retry'].forEach((id,index)=>document.getElementById(id).textContent=text[index]);document.getElementById('retry').onclick=()=>location.reload();
</script></body></html>
