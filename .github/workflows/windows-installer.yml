name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Simeon-Windows-installer
          path: |
            desktop/release/Simeon-Setup.exe
            desktop/release/Simeon-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw 'Release tag must match desktop package version' }
          gh release create $env:GITHUB_REF_NAME desktop/release/Simeon-Setup.exe desktop/release/Simeon-Setup.exe.sha256 --verify-tag --title "Simeon for Windows $version" --notes "Download Simeon-Setup.exe for Windows 10/11 x64. Internet is required. Sign in with your existing Simeon account. This installer is unsigned; Windows may show Unknown publisher or SmartScreen warnings. Paid signing is deferred."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
